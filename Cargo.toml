[package]
edition      = "2024"
license      = "MIT"
name         = "xiaozhi-s3"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "xiaozhi-s3"
path = "./src/bin/main.rs"

[[bin]]
name = "wifi-test"
path = "./src/bin/wifi-test.rs"
required-features = ["wifi"]

[[bin]]
name = "xiaozhi-cloud"
path = "./src/bin/xiaozhi-cloud.rs"
required-features = ["wifi"]

[dependencies]
# 纯逻辑核心层（音量映射/时钟计算/寄存器序列/状态机），host 可单元测试
# git submodule: xiaozhi-core
xiaozhi-core = { path = "xiaozhi-core" }

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

critical-section = "1.2.0"
esp-alloc        = { version = "0.10.0", features = ["defmt"] }
esp-println      = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }
esp-radio = { version = "1.0.0-beta.0", optional = true, features = ["esp32s3", "wifi", "esp-alloc", "defmt", "unstable"] }
esp-rtos = { version = "0.3.0", optional = true, features = ["esp32s3", "esp-radio", "esp-alloc", "embassy", "defmt"] }
embassy-time = { version = "0.5.0", optional = true }
static_cell = { version = "2.1.0", optional = true }
embassy-net = { version = "0.8.0", optional = true, features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }
esp-storage = { version = "0.8.1", optional = true, features = ["esp32s3"] }
embedded-storage = { version = "0.3.1", optional = true }
embassy-executor = { version = "0.10.0", optional = true }
heapless = { version = "0.8.0", optional = true }

[features]
default = ["board-gezipai"]

## gezipai 开发板 (ES8311 + ES7210 + ST7789)
board-gezipai = []

## 新增板子: 先建 src/bsp/<board>.rs, 再加 feature 与 src/bsp/mod.rs 注册
# board-<name> = []

## WiFi (esp-radio + esp-rtos + 配网/网络栈)
wifi = [
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:esp-storage",
    "dep:embedded-storage",
    "dep:heapless",
    "dep:embassy-net",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:static_cell",
]


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
