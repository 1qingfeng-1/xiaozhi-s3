[package]
edition      = "2024"
license      = "MIT"
name         = "xiaozhi-s3"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "xiaozhi-s3"
path = "./src/bin/main.rs"

[[bin]]
name = "wifi-test"
path = "./src/bin/wifi-test.rs"

[build-dependencies]
# vendor/libopus (xiph/opus v1.6.1 裁剪副本) 的 C 交叉编译
cc = "1"

[dependencies]
# 纯逻辑核心层（音量映射/时钟计算/寄存器序列/状态机），host 可单元测试
# git submodule: xiaozhi-core
xiaozhi-core = { path = "xiaozhi-core" }

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

critical-section = "1.2.0"
# compat: 提供 malloc/free/calloc/realloc —— libopus C 代码的堆分配入口
esp-alloc        = { version = "0.10.0", features = ["defmt", "compat"] }
esp-println      = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "esp-alloc", "defmt", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy", "defmt"] }
embassy-time = "0.5.0"
static_cell = "2.1.0"
embassy-net = { version = "0.8.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }
esp-storage = { version = "0.8.1", features = ["esp32s3"] }
embedded-storage = "0.3.1"
embassy-executor = "0.10.0"
heapless = "0.8.0"
esp-backtrace = { version = "0.19.0", default-features = false, features = ["esp32s3", "defmt"] }

[features]
default = ["board-gezipai"]

## gezipai 开发板 (ES8311 + ES7210 + ST7789)
board-gezipai = []

## 新增板子: 先建 src/bsp/<board>.rs, 再加 feature 与 src/bsp/mod.rs 注册
# board-<name> = []

## 关键词唤醒 (esp-sr WakeNet, "你好小智"): 链接级验证待完成, 见 vendor/esp-sr/README.md
wakenet = []


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
