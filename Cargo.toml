[package]
edition      = "2024"
license      = "MIT"
name         = "xiaozhi-s3"
rust-version = "1.88"
version = "1.0.0"
description  = "ESP32-S3 smart speaker firmware (xiaozhi protocol)"
repository   = "https://github.com/1qingfeng-1/xiaozhi-s3"
publish      = false

[[bin]]
name = "xiaozhi-s3"
path = "./src/bin/main.rs"

[[bin]]
name = "wifi-test"
path = "./src/bin/wifi-test.rs"

# HIL 控制代理: 仅显式 --features hil 时构建
[[bin]]
name = "hil-agent"
path = "./src/bin/hil-agent.rs"
required-features = ["hil"]

[build-dependencies]
# vendor/libopus (xiph/opus v1.6.1 裁剪副本) 的 C 交叉编译
cc = "1"

[dependencies]
# 纯逻辑核心层（音量映射/时钟计算/寄存器序列/状态机），host 可单元测试
# git submodule: xiaozhi-core
xiaozhi-core = { path = "xiaozhi-core" }

esp-hal = { version = "~1.1.0", features = ["defmt", "esp32s3", "unstable"] }


defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }

critical-section = "1.2.0"
# compat: 提供 malloc/free/calloc/realloc —— libopus C 代码的堆分配入口
esp-alloc        = { version = "0.10.0", features = ["defmt", "compat"] }
esp-println      = { version = "0.17.0", features = ["defmt-espflash", "esp32s3"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "esp-alloc", "defmt", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "esp-radio", "esp-alloc", "embassy", "defmt"] }
embassy-time = "0.5.0"
static_cell = "2.1.0"
embassy-net = { version = "0.8.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns"] }
esp-storage = { version = "0.8.1", features = ["esp32s3", "defmt"] }
embedded-storage = "0.3.1"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
heapless = "0.8.0"
esp-backtrace = { version = "0.19.0", default-features = false, features = ["esp32s3", "defmt"] }
embassy-sync = "0.6"

[features]
default = ["board-gezipai"]

## 高频诊断日志 (RAW 转储/寄存器回读/1Hz 电平/[T] 追踪/TX 速率)
## 默认关闭, 发布固件零高频日志; 真机排查时 --features debug-diag
debug-diag = []

## OTA 回滚自测: 启动后立即 panic (确认前), 验证引导器回滚; 勿用于发布
ota-selftest-crash = []

## 会话自测: 开机 5s 后自动触发一次唤醒 (无人值守验证传输/播报链路); 勿用于发布
session-selftest = []

## 看门狗自测: 启用 RWDT 后阻塞主循环 12s, 应触发复位; 勿用于发布
watchdog-selftest = []

## 长句自测: 会话就绪后自动发一条文本请求, 触发服务端长 TTS (验证下行链路)
tts-selftest = []

## 诊断: 关闭播报中的实时上行 (定位 WiFi 上行/下行互相干扰); 勿用于发布
aec-off = []

## 诊断: 强制关闭功放 (定位扬声器 EMI/供电对 WiFi 的影响); 勿用于发布
pa-off = []

## 诊断: 强制 codec 音量为 0 (功放仍开, 定位扬声器电流/EMI); 勿用于发布
volume-off = []

## 空闲提示自测: 空闲窗口缩短为 5s, 便于验证提示音/低功耗流程; 勿用于发布
idle-selftest = []

## A/B 测试: WiFi 省电自适应切换 (空闲 Minimum / 会话 None)。
## 默认关闭 (常开 None); 开启后可能因切换瞬间丢包导致长句断序。
ps-adaptive = []

## 注: 空闲轻睡 (Rtc::sleep_light) 试用后出现唤醒/USB 失效, 已回退;
## 重新实现前不要启用, 详见 ROADMAP 低功耗记录。

## gezipai 开发板 (ES8311 + ES7210 + ST7789)
board-gezipai = []

## 新增板子: 先建 src/bsp/<board>.rs, 再加 feature 与 src/bsp/mod.rs 注册
# board-<name> = []

## 关键词唤醒 (esp-sr WakeNet, "你好小智"): 链接级验证待完成, 见 vendor/esp-sr/README.md
wakenet = []

## HIL 控制代理 (src/bin/hil-agent.rs): 第二路 USB Serial/JTAG 控制通道
## 与主固件互斥使用, 仅用于真机自动化验证
hil = []


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"
# no_std + panic handler: 明确 abort, 不尝试栈展开
panic = "abort"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
panic         = "abort"
