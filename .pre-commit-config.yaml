fail_fast: false
repos:
  # 通用文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Rust 特定检查
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: bash -c "cargo fmt --all -- --check"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources with embedded-focused lints
        entry: bash -c "cargo clippy --all-targets --all-features -- -D warnings --cap-lints allow"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: bash -c "cargo check --all"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        description: Check cargo dependencies for security and license issues
        entry: bash -c "cargo deny check advisories licenses"
        language: system
        files: Cargo\.(toml|lock)
        pass_filenames: false

      - id: typos
        name: typos
        description: Check for common typos
        entry: bash -c "typos"
        language: system
        files: \..*$
        pass_filenames: false

  # 文档检查
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        description: Lint Markdown files
        entry: markdownlint-cli2
        language: node
        files: \.md$

# 排除不需要的文件
exclude: |
  (?x)^(
    target/.*|
    \.git/.*|
    \.github/.*|
    CHANGELOG\.md|
    \.pre-commit-config\.yaml|
    Cargo\.lock
  )$
