name: 功能建议
description: 提出新功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 资源影响评估
      description: 预计对栈 / 堆 / Flash / DMA 的影响（本项目资源非常紧张）
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      multiple: true
      options:
        - audio (I2S / opus / VAD)
        - session (WS / MQTT-UDP)
        - bsp / 新板移植
        - display / UI
        - wifi / 配网
        - OTA
        - build / CI / docs
