name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # 构建 release 固件
  build:
    name: Build release firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Install espflash
        uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Build release firmware
        run: cargo build --release --locked

      - name: Generate firmware images
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ELF=target/xtensa-esp32s3-none-elf/release/xiaozhi-s3
          mkdir -p release
          BOOTLOADER=assets/bootloader-esp32s3-rollback.bin
          # OTA / 手动写 ota_0 用的应用镜像
          espflash save-image --chip esp32s3 --flash-size 16mb \
            --bootloader "$BOOTLOADER" "$ELF" "release/xiaozhi-s3-${TAG}.bin"
          # 整片镜像 (bootloader + 分区表 + app), 用于 USB 全量烧录
          espflash save-image --chip esp32s3 --flash-size 16mb --merge --skip-padding \
            --bootloader "$BOOTLOADER" "$ELF" "release/xiaozhi-s3-${TAG}-merged.bin"

          SIZE=$(stat -c%s "release/xiaozhi-s3-${TAG}.bin")
          LIMIT=$((0x3F0000))
          echo "app image: ${SIZE} / ${LIMIT} bytes ($((SIZE * 100 / LIMIT))%)"
          test "$SIZE" -le $((LIMIT * 9 / 10))

          (cd release && sha256sum xiaozhi-s3-*.bin > SHA256SUMS)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-release
          path: release/
          retention-days: 30

  # 生成 changelog
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: build
    outputs:
      changelog: ${{ steps.generate.outputs.changelog }}
      tag_name: ${{ steps.extract.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract tag name
        id: extract
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${{ inputs.tag || 'v0.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog with git-cliff
        id: generate
        run: |
          # 安装 git-cliff
          cargo binstall git-cliff || cargo install git-cliff

          # 生成 changelog
          git-cliff --config cliff.toml --tag ${{ steps.extract.outputs.tag_name }} --strip-header > CHANGELOG.md

          # 输出 changelog 内容
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 30

  # 创建 GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, changelog]
    if: github.event_name == 'push' || inputs.tag != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          name: firmware-release
          path: release/

      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: changelog
          path: release/

      # Release body 里的 $(...) 不会被执行, 先在这里算好
      - name: Collect release metadata
        id: meta
        run: |
          echo "size=$(stat -c%s release/xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}.bin | numfmt --to=iec)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 release/SHA256SUMS | head -1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.changelog.outputs.tag_name }}
          name: Release ${{ needs.changelog.outputs.tag_name }}
          body: |
            ## 小智音箱固件发布

            ### 变更日志

            ${{ needs.changelog.outputs.changelog }}

            ### 固件信息

            - **芯片**: ESP32-S3R8
            - **Flash**: 16MB
            - **应用镜像大小**: ${{ steps.meta.outputs.size }}
            - **应用镜像 SHA256**: `${{ steps.meta.outputs.sha256 }}`
            - **构建日期**: ${{ steps.meta.outputs.date }}

            ### 烧录方法

            ```bash
            # 1) 整片镜像 (含 bootloader + 分区表, 推荐首次 USB 烧录)
            espflash write-bin 0x0 xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}-merged.bin

            # 2) 仅应用镜像 (写 ota_0, 或用于自定义 OTA)
            espflash write-bin 0x20000 xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}.bin

            # 或从源码构建/烧录
            cargo run --release
            ```

            ### 校验

            ```bash
            sha256sum -c SHA256SUMS
            espflash image_info --chip esp32s3 xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}.bin
            ```

          files: |
            release/xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}.bin
            release/xiaozhi-s3-${{ needs.changelog.outputs.tag_name }}-merged.bin
            release/SHA256SUMS
            release/CHANGELOG.md
          draft: false
          prerelease: false

      - name: Verify release
        run: |
          echo "=== Release created successfully ==="
          echo "Tag: ${{ needs.changelog.outputs.tag_name }}"
          echo "Files:"
          ls -lh release/
