name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 代码格式化检查
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install espup and ESP toolchain
        run: |
          cargo install espup --locked
          espup install
          if [ -f "$HOME/.espup/export-esp.sh" ]; then
            . "$HOME/.espup/export-esp.sh"
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fmt-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cargo fmt --all -- --check

  # Clippy 静态分析
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install espup and ESP toolchain
        run: |
          cargo install espup --locked
          espup install
          if [ -f "$HOME/.espup/export-esp.sh" ]; then
            . "$HOME/.espup/export-esp.sh"
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings --cap-lints allow

  # 类型检查
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install espup and ESP toolchain
        run: |
          cargo install espup --locked
          espup install
          if [ -f "$HOME/.espup/export-esp.sh" ]; then
            . "$HOME/.espup/export-esp.sh"
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: |
          cargo check --all

  # 单元测试
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install espup and ESP toolchain
        run: |
          cargo install espup --locked
          espup install
          if [ -f "$HOME/.espup/export-esp.sh" ]; then
            . "$HOME/.espup/export-esp.sh"
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: |
          cargo test --all-features

  # 构建固件
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install espup and ESP toolchain
        run: |
          cargo install espup --locked
          espup install
          if [ -f "$HOME/.espup/export-esp.sh" ]; then
            . "$HOME/.espup/export-esp.sh"
          fi

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Build release firmware
        run: |
          cargo build --release

      - name: Check firmware size
        run: |
          echo "=== Firmware Size Report ==="
          ls -lh target/xtensa-esp32s3-none-elf/release/xiaozhi-s3 || echo "Firmware not found"
          du -sh target/xtensa-esp32s3-none-elf/release/xiaozhi-s3
          echo "Flash size: 16MB (16777216 bytes)"
          echo "Firmware must be smaller than flash size"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: target/xtensa-esp32s3-none-elf/release/xiaozhi-s3
          retention-days: 7
