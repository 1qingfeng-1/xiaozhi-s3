name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # 代码格式化检查
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fmt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fmt-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy 静态分析
  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings --cap-lints allow

  # 类型检查
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --all

  # 纯逻辑核心层 (xiaozhi-core) host 单元测试
  # 不需要 esp 工具链 (host x86_64 target), 用 stable + cargo-nextest
  core-test:
    name: Core unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            xiaozhi-core/target
          key: ${{ runner.os }}-cargo-core-test-${{ hashFiles('xiaozhi-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-core-test-
            ${{ runner.os }}-cargo-

      - name: Core fmt
        working-directory: xiaozhi-core
        run: cargo fmt --all -- --check

      - name: Core clippy
        working-directory: xiaozhi-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Run core unit tests
        working-directory: xiaozhi-core
        run: cargo nextest run

  # 依赖安全/许可证审计 (与 pre-commit 的 cargo-deny 对齐)
  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories licenses

  # 构建固件（no_std 目标无法 cargo test，测试依赖 HIL 设备）
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check, core-test, deny]
    steps:
      - name: Checkout repository (with submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install ESP toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      # 自测 feature 组合必须都能编译 (默认构建不会覆盖这些分支)
      - name: Check feature matrix
        run: |
          cargo check --no-default-features --features board-gezipai
          cargo check --no-default-features --features board-gezipai,ps-adaptive
          cargo check --no-default-features --features board-gezipai,debug-diag
          cargo check --no-default-features --features board-gezipai,idle-selftest,session-selftest,tts-selftest
          cargo check --no-default-features --features board-gezipai,watchdog-selftest,ota-selftest-crash
          cargo check --no-default-features --features board-gezipai,aec-off,pa-off,volume-off

      - name: Build release firmware
        run: cargo build --release

      # 主任务栈 = DRAM 剩余空间; 任何 .bss 增长都会吃掉 opus 编码栈。
      # 下限 96KiB, 低于此值直接失败 (见 scripts/check_stack.sh)。
      - name: Check main stack budget
        run: ./scripts/check_stack.sh target/xtensa-esp32s3-none-elf/release/xiaozhi-s3

      - name: Check firmware size
        run: |
          echo "=== Firmware Size Report ==="
          ls -lh target/xtensa-esp32s3-none-elf/release/xiaozhi-s3 || echo "Firmware not found"
          du -sh target/xtensa-esp32s3-none-elf/release/xiaozhi-s3
          echo "Flash size: 16MB (16777216 bytes)"
          echo "Firmware must be smaller than flash size"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: target/xtensa-esp32s3-none-elf/release/xiaozhi-s3
          retention-days: 7
