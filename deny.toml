# Cargo deny 配置 - 针对嵌入式项目优化
# https://github.com/EmbarkStudios/cargo-deny

# 依赖许可证检查
[licenses]
# 允许的许可证白名单
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
]
# 检查许可证兼容性
confidence-threshold = 0.8

# 安全漏洞检查
[advisories]
# 忽略已知的安全漏洞 (需要手动维护)
ignore = [
    # paste crate 标记为 unmaintained (esp-hal 依赖链), 暂接受
    "RUSTSEC-2024-0436",
]
# 检查所有依赖
yanked = "deny"

# 源配置
[sources]
# 允许的 crate 源
unknown-registry = "deny"
unknown-git = "allow"
